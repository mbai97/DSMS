
name: Deploy Beckyn Certificate System

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to shared hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify admin files
        run: |
          echo "Checking admin directory..."
          if [ ! -d "admin" ]; then
            echo "ERROR: admin directory is missing from checkout"
            exit 1
          fi

          find admin -type f -print | sort

          echo "Total admin files:"
          find admin -type f | wc -l

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          dangerous-clean-slate: false
          log-level: verbose

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/config/config.php
            **/storage/certificates/**
            **/storage/qrcodes/**
            **/storage/logs/**
            **/README.md
